name: tinyschool

services:
  api:
    image: ${IMAGE_API}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      TINYSCHOOL_API_ADDRESS: ":8080"
      TINYSCHOOL_DB_PATH: /data/tinyschool.db
      # Origin used to build password reset links written to the API log.
      TINYSCHOOL_APP_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    volumes:
      - data:/data

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
