name: Release

# Every push to main cuts a new patch release: annotated tag + GitHub release,
# then calls Deploy to build images and roll out production.
#
# Deploy is invoked directly rather than left to the tag push, because tags
# pushed with GITHUB_TOKEN do not trigger workflow runs.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag to create (e.g. v0.1.0). Defaults to a patch bump.'
        required: false
        type: string
      notes:
        description: 'Optional release notes (otherwise auto-generated)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Reusable workflows can only narrow the caller's token, so Deploy's need for
# packages: write has to be granted here.
permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          VERSION="${RAW#"${RAW%%[![:space:]]*}"}"
          VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"

          if [[ -z "${VERSION}" ]]; then
            # Highest existing vX.Y.Z tag, or v0.0.0 when the repo has none.
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            LATEST="${LATEST:-v0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Bumping ${LATEST} -> ${VERSION}"
          fi

          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must look like v1.2.3 (got '${VERSION}')"
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create and push annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MESSAGE="Release ${VERSION}"
          if [[ -n "${NOTES}" ]]; then
            MESSAGE="${MESSAGE}

          ${NOTES}"
          fi
          git tag -a "${VERSION}" -m "${MESSAGE}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [[ -n "${NOTES}" ]]; then
            gh release create "${VERSION}" --title "${VERSION}" --notes "${NOTES}" --verify-tag
          else
            gh release create "${VERSION}" --title "${VERSION}" --generate-notes --verify-tag
          fi

  deploy:
    needs: tag
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
