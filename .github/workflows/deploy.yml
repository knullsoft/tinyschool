name: Deploy

on:
  workflow_dispatch:
  # Called by Release after it tags main; the tag it just pushed cannot start a
  # workflow on its own (GITHUB_TOKEN pushes don't trigger runs).
  workflow_call:
    inputs:
      version:
        description: 'Version to bake into the images (e.g. v0.1.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Images are built here rather than on the deploy host: the VPS needs ~20
  # minutes for a Nuxt build, which blew the job timeout and rebuilt from
  # scratch on every deploy. Runners are faster and keep a layer cache.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app_version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo "${GITHUB_SHA:0:7}")"
          fi
          # Only real releases move the :latest tag.
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Deploying app version: ${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_release == 'true' }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is empty"
            exit 1
          }
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is not a valid private key"
            exit 1
          }
          echo "Deployment key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key
          # ssh-keyscan intermittently returns nothing (exit 1) from runners;
          # retry rather than failing the whole deploy on a transient blip.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts && \
               grep -q . ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying"
            sleep 5
            [ "$attempt" -eq 5 ] && {
              echo "::error::could not scan host key for $DEPLOY_HOST"
              exit 1
            }
          done
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "true"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tinyschool' }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'tinyschool.147.93.97.228.nip.io' }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/deploy_key
          IMAGE_API: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          # Job-scoped token, so the host never stores a long-lived credential.
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh

  # Release workflow usually creates the GH release first; this is a safety net
  # when someone pushes a tag from the CLI without using Release.
  github-release:
    if: github.ref_type == 'tag'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
            exit 0
          fi
          gh release create "${VERSION}" --title "${VERSION}" --generate-notes --verify-tag
